spring:
  application:
    name: prime-transport-api
  datasource:
    url: jdbc:postgresql://localhost:5432/app
    username: app
    password: app
  jpa:
    # Le schéma est géré par Flyway : Hibernate se contente de le vérifier.
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/prime-transport

management:
  endpoints:
    web:
      exposure:
        include: health
